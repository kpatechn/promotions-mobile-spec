  /gem/v2/game/promotions/{promotionId}/prizes/{refId}/claim:
    post:
      tags:
      - Promotions
      operationId: claimPrize
      x-new: true
      summary: Claim one available prize
      description: |
        Claims a single prize. Idempotent per Idempotency-Key: a retry with the
        same key returns the original result, never ALREADY_CLAIMED.
      parameters:
      - name: promotionId
        in: path
        required: true
        schema:
          type: integer
          example: 608
      - name: refId
        in: path
        required: true
        schema:
          type: string
          format: uuid
          example: 636d5235-6ad3-498d-8504-f9793ccffc6d
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Prize claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimEnvelope'
              example:
                code: DS00
                statusCode: 200
                description: Prize claimed.
                response:
                  promotionId: 608
                  prize:
                    bucketId: 54845
                    refId: 636d5235-6ad3-498d-8504-f9793ccffc6d
                    status: claimed
                    isClaimable: false
                    rewardValue: 15
                    currency: USD
                    redemptionDate: '2026-11-06T15:02:41Z'
                    claimedTo: card
                    prizeId: 158
                    rewardName: New Member Welcome Reward
                    expiryDate: '2026-11-11T23:59:59.999999Z'
                  availablePrizeCount: 12
                  availablePrizeValue:
                    amount: 180
                    currency: USD
        '403':
          description: NOT_ELIGIBLE. Player no longer qualifies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: NOT_ELIGIBLE
                statusCode: 403
                description: This reward isn't available on this account.
                response: null
        '409':
          description: PRIZE_EXPIRED or ALREADY_CLAIMED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                expired:
                  value:
                    code: PRIZE_EXPIRED
                    statusCode: 409
                    description: This reward expired on 2026-11-11.
                    response: null
                alreadyClaimed:
                  value:
                    code: ALREADY_CLAIMED
                    statusCode: 409
                    description: This reward was already claimed.
                    response: null
        '503':
          description: SERVICE_UNAVAILABLE. Safe to retry with the same Idempotency-Key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                code: SERVICE_UNAVAILABLE
                statusCode: 503
                description: Claim service unavailable.
                response: null
components:
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    Money:
      type: object
      x-new: true
      required:
      - amount
      - currency
      properties:
        amount:
          type: number
          example: 195
        currency:
          type: string
          description: ISO 4217 code or POINTS
          example: USD
    TimeWindow:
      type: object
      x-new: true
      required:
      - start
      - end
      properties:
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        label:
          type:
          - string
          - 'null'
          example: First day of membership
    PromotionsEnvelope:
      type: object
      required:
      - code
      - statusCode
      - response
      properties:
        code:
          type: string
          example: DS00
        statusCode:
          type: integer
          example: 200
        description:
          type: string
        response:
          $ref: '#/components/schemas/PromotionsResponse'
    PromotionsResponse:
      type: object
      required:
      - playerCard
      - serverTime
      - timezone
      - promotions
      properties:
        playerCard:
          type: string
          example: Y1003014342
        corporateId:
          type: string
          example: '11'
        tenantId:
          type: string
          example: '11001'
        serverTime:
          type: string
          format: date-time
          x-new: true
          description: Server clock for countdowns
        timezone:
          type: string
          x-new: true
          example: America/Chicago
          description: IANA zone for display
        lastUpdated:
          type: string
          format: date-time
          x-new: true
          description: When progress data was last refreshed
        totalEligiblePromotions:
          type: integer
          example: 5
        totalAvailablePrizes:
          type: integer
          x-new: true
          example: 13
        totalAvailablePrizeValue:
          x-new: true
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        promotions:
          type: array
          items:
            $ref: '#/components/schemas/Promotion'
    Promotion:
      type: object
      required:
      - promotionId
      - proName
      - proStartDate
      - proEndDate
      - isEligible
      - hasAvailablePrizes
      - qualifiers
      - availablePrizes
      - redeemedPrizes
      properties:
        promotionId:
          type: integer
          example: 608
        proName:
          type: string
        proType:
          type: integer
          description: Legacy numeric type
        proTypeName:
          type: string
          x-new: true
          enum:
          - earn_and_get
          - streak
          - tiered_earn
          - recurring_earn
          - drawing
          - other
        propertyName:
          type: string
          x-new: true
          example: WinStar
        proShortDescription:
          type: string
        proDescription:
          type: string
          description: Plain text; newlines allowed
        proImageUrl:
          type: string
          description: Direct image URL (jpg, png, webp) or empty string
        imageAltText:
          type: string
          x-new: true
        termsUrl:
          type: string
          description: Rules page or PDF, or empty string
        proStartDate:
          type: string
          format: date-time
        proEndDate:
          type: string
          format: date-time
        eligibilityWindow:
          x-new: true
          description: The player's personal window when narrower than the promotion (for example, first
            day only)
          anyOf:
          - $ref: '#/components/schemas/TimeWindow'
          - type: 'null'
        activeWindows:
          type: array
          x-new: true
          description: Upcoming times when play counts, for time-restricted promotions
          items:
            $ref: '#/components/schemas/TimeWindow'
        nextWindowStart:
          type:
          - string
          - 'null'
          format: date-time
          x-new: true
        proStatus:
          type: integer
          example: 190
        statusDescription:
          type: string
          example: Running
        isEligible:
          type: boolean
        qualifierLogic:
          type: string
          x-new: true
          enum:
          - independent
          - sequential
          - all
        maxRewardValue:
          x-new: true
