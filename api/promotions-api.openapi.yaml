openapi: 3.1.0
info:
  title: PlayerHub Promotions API (Mobile)
  version: 2.1.0-proposed
  description: |
    Proposed v2.1 of the player promotions endpoint, extending the current
    /gem/v2/game/promotions response with the fields the mobile promotions
    screens need, plus a new claim endpoint.

    Fields marked "x-new: true" do not exist in today's response.
    All datetimes carry an offset or Z. Display times in `response.timezone`.
servers:
- url: https://chickasaw-dev.playerhub.ai
  description: Development
